name: Desktop Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Verify desktop frontend and platform config
        run: npm run verify:desktop

      - name: Test desktop Rust
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Lint desktop Rust
        run: cargo clippy --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

      - name: Build Tauri desktop
        run: npm run build:desktop --workspace @project-online/desktop
