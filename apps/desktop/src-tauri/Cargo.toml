[package]
name = "project-online-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "project_online_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2" }
thiserror = "2.0.20"
uuid = { version = "1.25.0", features = ["v4", "serde"] }

[features]
development = []

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
